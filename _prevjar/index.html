<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>zc_mc 控制台插件 - 测试台</title>
<style>
  :root { --bg:#12141a; --panel:#1b1f2a; --line:#2c3242; --txt:#dde3f0; --dim:#8a93ab; --acc:#5aa2ff; --ok:#4ade80; --err:#ff6b6b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; padding:18px; }
  h1 { font-size:18px; margin-bottom:12px; }
  h1 small { color:var(--dim); font-weight:normal; font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; max-width:1200px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:14px; color:var(--acc); margin-bottom:10px; }
  label { display:block; color:var(--dim); font-size:12px; margin:6px 0 2px; }
  input, select, textarea {
    width:100%; background:#0e1117; color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:6px 9px; font:13px/1.5 inherit;
  }
  textarea { min-height:70px; resize:vertical; }
  button {
    margin-top:10px; background:var(--acc); color:#08101d; border:0; border-radius:6px;
    padding:7px 16px; font-weight:600; cursor:pointer; font-size:13px;
  }
  button:hover { filter:brightness(1.15); }
  button.mini { padding:4px 10px; font-size:12px; margin:0 4px 4px 0; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  #outwrap { max-width:1200px; margin-top:14px; }
  #meta { color:var(--dim); font-size:12px; margin-bottom:6px; white-space:pre-wrap; }
  pre {
    background:#0b0d13; border:1px solid var(--line); border-radius:10px;
    padding:12px; white-space:pre-wrap; word-break:break-all; max-height:46vh; overflow:auto;
    font:12px/1.55 Consolas, monospace;
  }
  .badge-ok { color:var(--ok); } .badge-err { color:var(--err); }
</style>
</head>
<body>
<h1>zc_mc_控制台插件 测试台 <small id="conn">未连接</small></h1>

<div class="grid">
  <div class="card">
    <h2>连接</h2>
    <label>Token（config.yml → bridge.token）</label>
    <input id="token" value="test123">
    <button onclick="ping()">PING 连接测试</button>
    <button class="mini" onclick="saveToken()">保存到 localStorage</button>
  </div>

  <div class="card">
    <h2>执行命令 EXEC</h2>
    <label>命令（不需要加 /）</label>
    <input id="cmd" value="list" onkeydown="if(event.key==='Enter')exec()">
    <label>waitMs（执行后等待捕获日志的毫秒数）</label>
    <input id="waitms" value="500">
    <button onclick="exec()">执行</button>
  </div>

  <div class="card">
    <h2>数据查询 QUERY</h2>
    <button class="mini" onclick="q('PLAYERLIST')">在线玩家列表</button>
    <button class="mini" onclick="q('WORLDLIST')">世界列表</button>
    <div class="row">
      <input id="qp_name" placeholder="玩家名(可前缀)" value="">
      <button class="mini" onclick="q('PLAYER','qp_name')">查玩家</button>
      <button class="mini" onclick="q('OFFLINE','qp_name')">离线数据</button>
      <button class="mini" onclick="q('WORLD','qp_name')">查世界(填世界名)</button>
    </div>
    <label>方块查询 / 附近实体： 世界 x y z [半径]</label>
    <div class="row">
      <input id="qb_w" placeholder="world" value="world">
      <input id="qb_x" placeholder="x" value="0">
      <input id="qb_y" placeholder="y" value="64">
      <input id="qb_z" placeholder="z" value="0">
      <input id="qb_r" placeholder="半径" value="8">
    </div>
    <div>
      <button class="mini" onclick="qBlock()">查方块</button>
      <button class="mini" onclick="qNear()">附近实体</button>
    </div>
  </div>

  <div class="card">
    <h2>文件操作 FS</h2>
    <div class="row">
      <select id="fs_op">
        <option>READ</option><option>LIST</option><option>EXISTS</option>
        <option>WRITE</option><option>APPEND</option><option>REPLACE</option><option>SETLINE</option>
      </select>
      <input id="fs_path" placeholder="路径，相对服务器根目录" value="logs/latest.log">
    </div>
    <label>内容 data / content（WRITE·APPEND·SETLINE）</label>
    <textarea id="fs_data"></textarea>
    <div class="row">
      <input id="fs_search" placeholder="REPLACE 搜索文本">
      <input id="fs_replace" placeholder="替换为">
      <select id="fs_scope"><option>all</option><option>first</option></select>
    </div>
    <div class="row">
      <input id="fs_line" placeholder="SETLINE 行号">
      <input id="fs_max" placeholder="READ maxBytes(可选)">
    </div>
    <button onclick="fs()">执行文件操作</button>
  </div>
</div>

<div id="outwrap">
  <div id="meta"></div>
  <pre id="out">// 结果输出区</pre>
</div>

<script>
const $ = id => document.getElementById(id);
try { const t = localStorage.getItem('zc_token'); if (t) $('token').value = t; } catch(e) {}

function saveToken() { try { localStorage.setItem('zc_token', $('token').value); show('已保存 token'); } catch(e) {} }

function show(meta, text, ok, code) {
  $('meta').innerHTML = meta || '';
  if (text !== undefined) {
    $('out').textContent = text === '' ? '(空输出)' : text;
  }
}

async function api(ep, params) {
  const body = new URLSearchParams();
  for (const k in params) {
    const v = params[k];
    if (v !== undefined && v !== null && v !== '') body.append(k, v);
  }
  const r = await fetch('/api/' + ep, { method:'POST', body });
  return r.json();
}

async function ping() {
  try {
    const j = await api('ping', { token: $('token').value });
    $('conn').textContent = j.ok ? '● 已连接' : '● 鉴权失败';
    $('conn').className = j.ok ? 'badge-ok' : 'badge-err';
    show('GET /api/ping', JSON.stringify(j, null, 2));
  } catch (e) { $('conn').textContent = '● 连接失败'; $('conn').className='badge-err'; show('错误', String(e)); }
}

async function exec() {
  const j = await api('exec', { token:$('token').value, command:$('cmd').value, waitMs:$('waitms').value });
  render(j);
}

async function q(sub, inputId) {
  let p1 = inputId ? $(inputId).value : '';
  const j = await api('query', Object.assign({ token:$('token').value, sub }, p1 ? { p1 } : {}));
  render(j);
}

function qBlock() {
  q2('BLOCK', [$('qb_w').value, $('qb_x').value, $('qb_y').value, $('qb_z').value]);
}
function qNear() {
  q2('NEAR', [$('qb_w').value, $('qb_x').value, $('qb_y').value, $('qb_z').value, $('qb_r').value]);
}
async function q2(sub, ps) {
  const p = { token:$('token').value, sub };
  ps.forEach((v,i) => { if (v !== '') p['p'+(i+1)] = v; });
  render(await api('query', p));
}

async function fs() {
  const p = { token:$('token').value, op:$('fs_op').value, path:$('fs_path').value };
  if ($('fs_max').value) p.maxBytes = $('fs_max').value;
  if ($('fs_data').value) p.data = $('fs_data').value;
  if ($('fs_search').value) p.search = $('fs_search').value;
  if ($('fs_replace').value) p.replace = $('fs_replace').value;
  if ($('fs_scope').value) p.scope = $('fs_scope').value;
  if ($('fs_line').value) p.lineNo = $('fs_line').value;
  render(await api('fs', p));
}

function render(j) {
  const head = j.ok
    ? '<span class="badge-ok">OK</span>  code=' + esc(j.code)
    : '<span class="badge-err">ERROR</span>  code=' + esc(j.code);
  show(head, j.output);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

ping();
</script>
</body>
</html>
