bridge:
  host: 127.0.0.1
  port: 25580
  token: "change_me"
  read-timeout-ms: 15000

log-capture:
  enabled: true
  default-wait-ms: 300
  max-wait-ms: 15000
  max-lines: 80
  only-when-empty: false
  include-console-executor-line: false
  regex-filter: ""
  url-first: true
  file-path: "logs/latest.log"

  # 命中关键词后继续捕获后续行（解决 /list 只读到第一行的问题）
  capture-following-lines: true
  max-following-lines: 8

  # INFO_ONLY / INFO_AND_ABOVE / WARNING_AND_ABOVE
  level-mode: "INFO_ONLY"
  related-only: true
  include-url-lines: true
  extra-keywords:
    - "luckperms"
    - "lp"
    - "editor"

# 数据查询（主线程执行，Bukkit API 安全）
# QUERY|PLAYERLIST / QUERY|PLAYER|<name> / QUERY|OFFLINE|<name>
# QUERY|WORLDLIST / QUERY|WORLD|<name>
# QUERY|BLOCK|<world>|<x>|<y>|<z> / QUERY|NEAR|<world>|<x>|<y>|<z>[|<radius>]
query:
  enabled: true
  max-entities: 30

# 文件操作（相对路径基于服务器根目录）
# FS|READ|<pathB64>[|<maxBytes>]   读取文件(UTF-8文本)
# FS|LIST|<pathB64>                列目录: type|size|mtime|name
# FS|EXISTS|<pathB64>              存在性检查
# FS|WRITE|<pathB64>|<dataB64>     覆盖写入
# FS|APPEND|<pathB64>|<dataB64>    追加
# FS|REPLACE|<pathB64>|<searchB64>|<replaceB64>|all|first   关键字替换
# FS|SETLINE|<pathB64>|<lineNo>|<contentB64>                按行号修改
# 注意：服务器运行中修改世界存档(.dat/.mca)可能被内存数据覆盖或损坏，
#      改配置类文件后通常需要 reload 才生效。
fs:
  enabled: true
  read-only: false          # true 时禁止 WRITE/APPEND/REPLACE/SETLINE
  allow-absolute-paths: false
  max-read-bytes: 262144    # 单次 READ 上限(字节)
  blocked-paths: []         # 例: ["plugins/AstrBotRconBridge/config.yml", "logs/"]

security:
  enable-ip-whitelist: false
  whitelist:
    - "127.0.0.1"
    - "::1"

messages:
  auth-failed: "AUTH_FAILED"
  forbidden-ip: "FORBIDDEN_IP"
  bad-request: "BAD_REQUEST"
  internal-error: "INTERNAL_ERROR"
