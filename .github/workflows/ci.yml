name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java-agent:
    name: mc-agent (Java 8 target)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mc-agent-java
    steps:
      - uses: actions/checkout@v4

      # pom 里的 source/target 是 1.8（服务端跑在 Java 8 上的 1.12.2 环境）。
      # 用 JDK 17 编译，不用 update-latest：新 JDK 可能已不再接受 source 8。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 版本一致性：pom 的 <version> 与 plugin.yml 的 version 必须一致，
      # 否则打出来的 jar 名字/插件页显示的版本各说各话（历史上 pom 停在
      # 1.0.0 而 plugin.yml 已是 1.3.0，CI 才会找不到 mc-agent-*.jar）。
      - name: Assert version consistency
        shell: bash
        run: |
          pom_ver=$(sed -n 's#.*<version>\([0-9][^<]*\)</version>.*#\1#p' pom.xml | head -1)
          yml_ver=$(sed -n 's#^version:[[:space:]]*\([^[:space:]]*\).*#\1#p' \
                    src/main/resources/plugin.yml | head -1)
          echo "pom=$pom_ver plugin.yml=$yml_ver"
          if [ "$pom_ver" != "$yml_ver" ]; then
            echo "::error::版本不一致：pom.xml=$pom_ver plugin.yml=$yml_ver"
            exit 1
          fi

      - name: Build
        run: mvn -B -ntp package -DskipTests

      # finalName 固定为 mc-agent，jar 落在 target/mc-agent.jar
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mc-agent-jar
          path: mc-agent-java/target/mc-agent.jar
          if-no-files-found: error

  python:
    name: framework (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml flask

      - name: Byte-compile
        run: python -m compileall -q framework plugins webui main.py

      # 换行符守卫：start.sh 带 CRLF 到 Linux 就是 bad interpreter。
      - name: Reject CRLF in shell scripts
        shell: bash
        run: |
          bad=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::file contains CRLF line endings"
              bad=1
            fi
          done < <(git ls-files '*.sh')
          exit $bad

      - name: Syntax check (bash -n)
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail
