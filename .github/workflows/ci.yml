name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java-agent:
    name: mc-agent (Java 8 target)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mc-agent-java
    steps:
      - uses: actions/checkout@v4

      # pom 里的 source/target 是 1.8（服务端跑在 Java 8 上的 1.12.2 环境）。
      # 用 JDK 17 编译，不用 update-latest：新 JDK 可能已不再接受 source 8。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -B -ntp package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mc-agent-jar
          path: mc-agent-java/target/mc-agent-*.jar
          if-no-files-found: error

  python:
    name: framework (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml flask

      - name: Byte-compile
        run: python -m compileall -q framework plugins webui main.py

      # 换行符守卫：start.sh 带 CRLF 到 Linux 就是 bad interpreter。
      - name: Reject CRLF in shell scripts
        shell: bash
        run: |
          bad=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::file contains CRLF line endings"
              bad=1
            fi
          done < <(git ls-files '*.sh')
          exit $bad

      - name: Syntax check (bash -n)
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail
