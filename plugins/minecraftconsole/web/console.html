<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minecraftconsole 控制台</title>
<style>
:root {
  --sidebar-width: 220px;
  --brand-gradient: linear-gradient(135deg, #6366f1, #38bdf8);
  --accent: #6366f1;
  --bg: #07080d;
  --sidebar-bg: #0b0d14;
  --overlay-bg: #10131d;
  --text-primary: #e8ebf4;
  --text-regular: #c8cddd;
  --text-secondary: #8b93ad;
  --border: #1c2133;
  --border-light: #1c2133;
  --fill: #10131d;
  --fill-light: #12151f;
  --fill-lighter: #141828;
  --primary: #6366f1;
  --primary-light-3: #818cf8;
  --primary-light-5: #a5b4fc;
  --primary-light-7: #c7d2fe;
  --primary-light-9: #1b1f3d;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
}

html.light {
  --bg: #f5f7fa;
  --sidebar-bg: #ffffff;
  --overlay-bg: #ffffff;
  --text-primary: #1f2937;
  --text-regular: #374151;
  --text-secondary: #6b7280;
  --border: #e5e7eb;
  --border-light: #f3f4f6;
  --fill: #f9fafb;
  --fill-light: #fafafa;
  --fill-lighter: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  transition: background-color .3s ease, color .3s ease;
}

/* 布局 */
.app { display: flex; height: 100vh; }
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: width .2s;
  overflow: hidden;
}
.sidebar.collapsed { width: 64px; }

.brand {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
}
.brand-logo {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--brand-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 18px;
}
.brand-name {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .02em;
  background: var(--brand-gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.sidebar.collapsed .brand-name { display: none; }

.nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  color: var(--text-regular);
  font-size: 14px;
  transition: background-color .2s, color .2s;
  border-radius: 6px;
  margin: 2px 8px;
}
.nav-item:hover { background: var(--fill-light); color: var(--text-primary); }
.nav-item.active { background: var(--primary-light-9); color: var(--primary-light-3); }
.nav-item .icon { width: 20px; text-align: center; font-size: 16px; }
.sidebar.collapsed .nav-item span { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 10px; }

.sidebar-foot { border-top: 1px solid var(--border); padding: 8px 0; }
.sidebar-version { text-align: center; color: var(--text-secondary); font-size: 12px; padding: 6px 0; }
.sidebar.collapsed .sidebar-version { display: none; }

/* 右侧主区 */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 52px;
  background: var(--sidebar-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-right { display: flex; align-items: center; gap: 12px; }

.btn-icon {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-regular);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all .2s;
}
.btn-icon:hover { background: var(--fill-light); color: var(--primary); }

.page-title { font-size: 16px; font-weight: 600; }

.user-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 6px;
  transition: background .2s;
}
.user-chip:hover { background: var(--fill-light); }
.user-tag {
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--primary-light-9);
  color: var(--primary-light-3);
}

.content { flex: 1; overflow: auto; padding: 0; }
.page { display: none; height: 100%; }
.page.active { display: block; }

/* 登录页 */
.login-page {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse 60% 45% at 50% 0%, #1a2133 0%, var(--bg) 65%);
}
.login-card {
  width: 360px;
  background: var(--sidebar-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 28px;
}
.login-logo {
  width: 52px;
  height: 52px;
  border-radius: 13px;
  background: var(--brand-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 24px;
  margin-bottom: 14px;
}
.login-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.login-sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.form-input {
  width: 100%;
  background: var(--fill);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
}
.form-input:focus { border-color: var(--primary); }
.form-error { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }
.btn-primary {
  width: 100%;
  margin-top: 14px;
  background: var(--brand-gradient);
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 11px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .2s;
}
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }
.btn-primary:hover:not(:disabled) { opacity: .9; }

/* 控制台页 */
.console-page { display: flex; flex-direction: column; height: 100%; padding: 16px; gap: 16px; }
.status-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.stat-card {
  background: var(--overlay-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  transition: transform .25s ease, box-shadow .25s ease;
}
.stat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px -8px rgba(99, 102, 241, .18); }
.stat-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
.stat-value { font-size: 26px; font-weight: 700; line-height: 1.2; }
.stat-value.online { color: var(--success); }
.stat-value.offline { color: var(--danger); }

.quick-cmds { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-cmd {
  padding: 6px 12px;
  background: var(--fill-light);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-regular);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.btn-cmd:hover { background: var(--primary-light-9); color: var(--primary-light-3); border-color: var(--primary); }

.cmd-input-box {
  display: flex;
  gap: 8px;
  background: var(--overlay-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px;
}
.cmd-input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  padding: 6px;
}
.btn-send {
  padding: 6px 16px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: opacity .2s;
}
.btn-send:hover { opacity: .9; }
.btn-send:disabled { opacity: .5; cursor: not-allowed; }

.log-box {
  flex: 1;
  background: var(--fill);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  overflow: auto;
  font-family: Consolas, Menlo, monospace;
  font-size: 12px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-all;
}
.log-line { margin-bottom: 2px; }
.log-time { color: var(--text-secondary); }
.log-sys { color: var(--primary-light-3); }
.log-conn { color: #7dd3fc; }
.log-admin { color: #fbbf24; }
.log-mc { color: #10b981; }

/* 工作流页 */
.workflow-page { padding: 16px; }
.wf-toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
.btn {
  padding: 8px 16px;
  background: var(--fill-light);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-regular);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.btn:hover { background: var(--primary-light-9); color: var(--primary-light-3); }
.btn-primary-solid { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary-solid:hover { opacity: .9; }

.wf-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.wf-card {
  background: var(--overlay-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  transition: all .25s;
}
.wf-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px -8px rgba(99, 102, 241, .18); border-color: var(--primary); }
.wf-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.wf-card-title { font-size: 15px; font-weight: 600; }
.wf-card-status { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
.wf-card-status.enabled { background: rgba(16, 185, 129, .15); color: var(--success); }
.wf-card-status.disabled { background: rgba(107, 114, 128, .15); color: var(--text-secondary); }
.wf-card-desc { font-size: 12px; color: var(--text-secondary); }

/* 文件管理页 */
.files-page { padding: 16px; display: flex; flex-direction: column; height: 100%; }
.files-toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
.files-path {
  flex: 1;
  background: var(--fill);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  color: var(--text-primary);
  font-size: 13px;
  font-family: Consolas, Menlo, monospace;
}
.files-list {
  flex: 1;
  background: var(--overlay-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: auto;
}
.file-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-light);
  cursor: pointer;
  transition: background .2s;
}
.file-item:hover { background: var(--fill-light); }
.file-item:last-child { border-bottom: none; }
.file-icon { font-size: 18px; width: 24px; text-align: center; }
.file-name { flex: 1; font-size: 14px; }
.file-size { font-size: 12px; color: var(--text-secondary); }

/* 框架后台页 */
.frame-page { height: 100%; }
.frame-page iframe { width: 100%; height: 100%; border: none; }

/* 滚动条 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary-light-5); }
::-webkit-scrollbar-track { background: transparent; }

/* 响应式 */
@media (max-width: 768px) {
  .sidebar { position: absolute; z-index: 100; height: 100%; transform: translateX(-100%); }
  .sidebar.show { transform: translateX(0); }
  .status-cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<!-- 登录页 -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-logo">⛏</div>
    <div class="login-title">minecraftconsole</div>
    <div class="login-sub">登录后进入 MC 控制台</div>
    <div class="form-group">
      <label class="form-label">用户名</label>
      <input type="text" id="loginUsername" class="form-input" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="loginError" class="form-error"></div>
    <button id="loginBtn" class="btn-primary">登 录</button>
  </div>
</div>

<!-- 主界面 -->
<div id="mainApp" class="app" style="display:none;">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-logo">⛏</div>
      <span class="brand-name">minecraftconsole</span>
    </div>
    <nav class="nav">
      <div class="nav-item active" data-page="console">
        <span class="icon">📡</span>
        <span>MC 控制台</span>
      </div>
      <div class="nav-item" data-page="monitor">
        <span class="icon">📈</span>
        <span>历史监控</span>
      </div>
      <div class="nav-item" data-page="workflow">
        <span class="icon">🔀</span>
        <span>工作流</span>
      </div>
      <div class="nav-item" data-page="files">
        <span class="icon">📁</span>
        <span>文件管理</span>
      </div>
      <div class="nav-item" data-page="frame">
        <span class="icon">🛠</span>
        <span>框架后台</span>
      </div>
    </nav>
    <div class="sidebar-foot">
      <div class="sidebar-version">v1.0.0</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button id="toggleSidebar" class="btn-icon" title="折叠侧边栏">☰</button>
        <span id="pageTitle" class="page-title">MC 控制台</span>
      </div>
      <div class="topbar-right">
        <button id="toggleTheme" class="btn-icon" title="切换主题">🌙</button>
        <div id="userChip" class="user-chip">
          <span>👤</span>
          <span id="username">admin</span>
          <span class="user-tag">超管</span>
        </div>
        <button id="logoutBtn" class="btn-icon" title="退出登录">⎋</button>
      </div>
    </header>

    <div class="content">
      <!-- MC 控制台 -->
      <div id="consolePage" class="page active">
        <div class="console-page">
          <div class="status-cards">
            <div class="stat-card">
              <div class="stat-label">服务器状态</div>
              <div id="statusOnline" class="stat-value offline">离线</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">TPS</div>
              <div id="statusTps" class="stat-value">0.00</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">在线玩家</div>
              <div id="statusPlayers" class="stat-value">0</div>
            </div>
          </div>

          <div>
            <div class="stat-label" style="margin-bottom:8px;">快捷命令</div>
            <div class="quick-cmds">
              <button class="btn-cmd" data-cmd="list">/list</button>
              <button class="btn-cmd" data-cmd="tps">/tps</button>
              <button class="btn-cmd" data-cmd="say ">/say</button>
              <button class="btn-cmd" data-cmd="give @a command_block">/give</button>
              <button class="btn-cmd" data-cmd="op ">/op</button>
              <button class="btn-cmd" data-cmd="deop ">/deop</button>
              <button class="btn-cmd" data-cmd="gamemode ">/gamemode</button>
              <button class="btn-cmd" data-cmd="kill ">/kill</button>
            </div>
          </div>

          <div class="cmd-input-box">
            <input type="text" id="cmdInput" class="cmd-input" placeholder="输入 MC 命令，如 give @a command_block（无需开头的 /）">
            <button id="sendCmdBtn" class="btn-send">发送</button>
          </div>

          <div id="logBox" class="log-box"></div>
        </div>
      </div>

      <!-- 历史监控 -->
      <div id="monitorPage" class="page">
        <style>
          .monitor-page { padding: 16px 20px; }
          .monitor-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
          .monitor-card {
            background: var(--fill, #10131d); border: 1px solid var(--border, #1c2133);
            border-radius: 10px; padding: 14px;
          }
          .monitor-title { font-size: 14px; color: var(--text-regular, #c8cddd); margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center; }
          .monitor-card canvas { width: 100%; height: 190px; display: block; }
          .monitor-empty { text-align:center; padding:40px; color:var(--text-secondary,#8b93ad); }
        </style>
        <div class="monitor-page">
          <div class="monitor-title" style="margin-bottom:12px;font-size:15px;color:var(--text-primary);">
            <span>服务器运行历史（每 1s 一条心跳，最近 1000 条）</span>
            <button id="monitorRefresh" class="btn">刷新</button>
          </div>
          <div class="monitor-cards">
            <div class="monitor-card">
              <div class="monitor-title"><span>TPS</span><span id="tpsAvg" style="color:var(--text-secondary);font-size:12px;"></span></div>
              <canvas id="tpsChart"></canvas>
            </div>
            <div class="monitor-card">
              <div class="monitor-title"><span>在线玩家</span><span id="playersSum" style="color:var(--text-secondary);font-size:12px;"></span></div>
              <canvas id="playersChart"></canvas>
            </div>
          </div>
          <div id="monitorEmpty" class="monitor-empty" style="display:none;">暂无心跳数据（服务器在线后每秒自动记录）</div>
        </div>
      </div>

      <!-- 工作流 -->
      <div id="workflowPage" class="page">
        <div class="workflow-page">
          <div class="wf-toolbar">
            <button id="newWfBtn" class="btn btn-primary-solid">+ 新建工作流</button>
            <button id="refreshWfBtn" class="btn">刷新</button>
          </div>
          <div id="wfList" class="wf-list"></div>
        </div>
      </div>

      <!-- 文件管理 -->
      <div id="filesPage" class="page">
        <div class="files-page">
          <div class="files-toolbar">
            <button id="filesBackBtn" class="btn">⬆ 上级</button>
            <input type="text" id="filesPath" class="files-path" value="/" readonly>
            <button id="filesRefreshBtn" class="btn">刷新</button>
          </div>
          <div id="filesList" class="files-list"></div>
        </div>
      </div>

      <!-- 框架后台 -->
      <div id="framePage" class="page">
        <div class="frame-page">
          <iframe id="frameIframe" src="/index.html"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // 状态
  const state = {
    token: localStorage.getItem('mc_token') || '',
    username: '',
    role: '',
    theme: localStorage.getItem('mc_theme') || 'dark',
    currentPage: 'console',
    statusTimer: null,
    sseSource: null,
    workflows: [],
    filesPath: '/',
  };

  // API 端口配置
  const MC_API_PORT = 25598;  // 插件 asyncio HTTP 服务器端口
  const FRAME_API_BASE = '';  // 框架 Flask 服务器（同源）

  // DOM
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  // API 封装
  // noAuth=true：不带头也不自动登出（用于"只凭 Cookie 探测是否已登录"）
  async function api(path, options = {}, useMcPort = false, noAuth = false) {
    const headers = { 'Content-Type': 'application/json' };
    // 25598 控制台服务不做令牌校验且 CORS 白名单不含 Authorization，跨源请求不带该头
    if (state.token && !useMcPort && !noAuth) headers['Authorization'] = 'Bearer ' + state.token;

    const baseUrl = useMcPort ? `http://${location.hostname}:${MC_API_PORT}` : FRAME_API_BASE;
    const url = baseUrl + path;

    let resp;
    try {
      resp = await fetch(url, { ...options, headers });
    } catch (e) {
      console.error('API 错误:', path, e);
      throw e;
    }
    if (resp.status === 401) {
      if (!noAuth) await logoutSafe();
      throw new Error('未登录');
    }
    try {
      return await resp.json();
    } catch (e) {
      throw new Error('响应不是 JSON (HTTP ' + resp.status + ')');
    }
  }

  // 静默登出（直接 fetch，避免 401 递归）
  async function logoutSafe() {
    try {
      await fetch(FRAME_API_BASE + '/api/mc/auth/logout', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
      });
    } catch (e) {}
  }

  // 登录
  async function login() {
    const username = $('#loginUsername').value.trim();
    const password = $('#loginPassword').value;
    if (!username || !password) {
      $('#loginError').textContent = '请输入用户名和密码';
      return;
    }
    $('#loginBtn').disabled = true;
    $('#loginError').textContent = '';
    try {
      const data = await api('/api/mc/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
      });
      if (data.code === 0) {
        enterApp(data.data, data.data.token);
      } else {
        $('#loginError').textContent = data.msg || '登录失败';
      }
    } catch (e) {
      const port = location.port || (location.protocol === 'https:' ? '443' : '80');
      if (['8080', '25598'].indexOf(port) < 0) {
        // 典型的「静态预览页没有后端」场景：给出明确指引而不是笼统的网络错误
        $('#loginError').textContent = '当前是静态预览页（端口 ' + port + '），无后端接口。请访问 http://127.0.0.1:8080 登录。';
      } else {
        $('#loginError').textContent = '登录失败：请确认框架已启动（8080）且账号密码正确' +
          (e && e.message ? '（' + e.message + '）' : '');
      }
    } finally {
      $('#loginBtn').disabled = false;
    }
  }

  // 登出
  async function logout() {
    await logoutSafe();
    state.token = '';
    state.username = '';
    state.role = '';
    localStorage.removeItem('mc_token');
    localStorage.removeItem('zcbot_token');
    stopStatusPolling();
    disconnectSSE();
    $('#mainApp').style.display = 'none';
    $('#loginPage').style.display = 'flex';
    $('#loginUsername').value = '';
    $('#loginPassword').value = '';
  }

  // 进入主界面（登录成功 或 已有会话）
  function enterApp(user, token) {
    state.token = token || state.token || '';
    state.username = (user && user.username) || '';
    state.role = (user && user.role) || '';
    if (token) {
      // 同时种框架 SPA 用的 zcbot_token，保证「框架后台」iframe 免再登录
      localStorage.setItem('mc_token', token);
      localStorage.setItem('zcbot_token', token);
    }
    $('#loginPage').style.display = 'none';
    $('#mainApp').style.display = 'flex';
    $('#username').textContent = state.username;
    startStatusPolling();
    connectSSE();
  }

  function showLogin() {
    stopStatusPolling();
    disconnectSSE();
    $('#mainApp').style.display = 'none';
    $('#loginPage').style.display = 'flex';
  }

  // 检查登录状态：优先 Cookie 免登（框架或本面板登录过即有效），再兜底本地 token
  async function checkAuth() {
    // 1) Cookie 已登录（/api/mc/auth/login 与框架 /api/login 都种 HttpOnly Cookie zcbot_token）
    try {
      const d = await api('/api/mc/auth/me', {}, false, true);
      if (d.code === 0) { enterApp(d.data, ''); return; }
    } catch (e) {}
    // 2) 本地 token 兜底（mc_token / zcbot_token 均认）
    const t = localStorage.getItem('mc_token') || localStorage.getItem('zcbot_token');
    if (t) {
      state.token = t;
      try {
        const d = await api('/api/mc/auth/me');
        if (d.code === 0) { enterApp(d.data, t); return; }
      } catch (e) {}
      state.token = '';
    }
    showLogin();
  }

  // 状态轮询
  async function loadStatus() {
    try {
      const data = await api('/api/status', {}, true);
      if (data.ok) {
        const s = data.data;
        $('#statusOnline').textContent = s.online ? '在线' : '离线';
        $('#statusOnline').className = 'stat-value ' + (s.online ? 'online' : 'offline');
        $('#statusTps').textContent = s.tps.toFixed(2);
        $('#statusPlayers').textContent = s.players;
      }
    } catch (e) {}
  }

  function startStatusPolling() {
    loadStatus();
    state.statusTimer = setInterval(loadStatus, 3000);
  }

  function stopStatusPolling() {
    if (state.statusTimer) {
      clearInterval(state.statusTimer);
      state.statusTimer = null;
    }
  }

  // SSE 日志流
  function connectSSE() {
    disconnectSSE();
    const url = `http://${location.hostname}:${MC_API_PORT}/api/stream`;
    const es = new EventSource(url);
    es.onmessage = (e) => {
      appendLog(e.data);
    };
    es.onerror = () => {
      setTimeout(connectSSE, 3000);
    };
    state.sseSource = es;
  }

  function disconnectSSE() {
    if (state.sseSource) {
      state.sseSource.close();
      state.sseSource = null;
    }
  }

  function appendLog(line) {
    const box = $('#logBox');
    const div = document.createElement('div');
    div.className = 'log-line';
    const time = new Date().toLocaleTimeString();
    let cls = '';
    if (line.startsWith('[sys]')) cls = 'log-sys';
    else if (line.startsWith('[conn]')) cls = 'log-conn';
    else if (line.startsWith('[admin')) cls = 'log-admin';
    else if (line.startsWith('[mc') || line.startsWith('[MC]')) cls = 'log-mc';
    div.innerHTML = `<span class="log-time">[${time}]</span> <span class="${cls}">${escapeHtml(line)}</span>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    while (box.childElementCount > 500) box.removeChild(box.firstChild);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // 发送命令
  async function sendCommand(cmd) {
    if (!cmd.trim()) return;
    $('#sendCmdBtn').disabled = true;
    try {
      const data = await api('/api/cmd', {
        method: 'POST',
        body: JSON.stringify({ command: cmd }),
      }, true);
      if (data.ok) {
        appendLog(`[admin:0] /${cmd}`);
      } else {
        appendLog(`[error] ${data.error || '发送失败'}`);
      }
    } catch (e) {
      appendLog(`[error] 请求失败`);
    } finally {
      $('#sendCmdBtn').disabled = false;
      $('#cmdInput').value = '';
    }
  }

  // 工作流
  async function loadWorkflows() {
    try {
      const data = await api('/api/mc/workflow');
      if (data.code === 0) {
        state.workflows = data.data || [];
        renderWorkflows();
      }
    } catch (e) {}
  }

  function renderWorkflows() {
    const list = $('#wfList');
    if (state.workflows.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);">暂无工作流</div>';
      return;
    }
    list.innerHTML = state.workflows.map(wf => `
      <div class="wf-card" data-id="${wf.id}">
        <div class="wf-card-header">
          <div class="wf-card-title">${escapeHtml(wf.name || wf.id)}</div>
          <div class="wf-card-status ${wf.enabled ? 'enabled' : 'disabled'}">${wf.enabled ? '启用' : '禁用'}</div>
        </div>
        <div class="wf-card-desc">${escapeHtml(wf.desc || '无描述')}</div>
      </div>
    `).join('');
  }

  // 文件管理
  async function loadFiles(path) {
    state.filesPath = (path || '').replace(/^\/+/, '');
    $('#filesPath').value = state.filesPath ? state.filesPath : '/';
    try {
      // agent FS 禁止绝对路径：一律发相对路径（根用 .）
      const rel = state.filesPath.replace(/^\/+/, '') || '.';
      const data = await api('/api/mc/fs', {
        method: 'POST',
        body: JSON.stringify({ op: 'list', path: rel }),
      });
      if (data.code === 0) {
        const t = String((data.data && data.data.output) || '');
        if (/^FS 参数错误|^不是目录|^无法/.test(t)) {
          $('#filesList').innerHTML = '<div style="text-align:center;padding:40px;color:var(--danger,#ef4444);font-size:13px;">' + escapeHtml(t) + '</div>';
          return;
        }
        renderFiles(parseFileList(data.data, state.filesPath));
      } else if (data.code !== 401) {
        $('#filesList').innerHTML = '<div style="text-align:center;padding:40px;color:var(--danger,#ef4444);font-size:13px;">' + escapeHtml(data.msg || '加载失败') + '</div>';
      }
    } catch (e) { console.error('加载文件列表失败:', e); }
  }

  function renderFiles(files) {
    const list = $('#filesList');
    if (files.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);">空目录</div>';
      return;
    }
    list.innerHTML = files.map(f => `
      <div class="file-item" data-path="${escapeHtml(f.path)}" data-is-dir="${f.is_dir}">
        <div class="file-icon">${f.is_dir ? '📁' : '📄'}</div>
        <div class="file-name">${escapeHtml(f.name)}</div>
        <div class="file-size">${f.is_dir ? '' : formatSize(f.size)}</div>
      </div>
    `).join('');
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }

  // ---- 历史监控（心跳曲线）----
  async function loadMonitor() {
    try {
      const data = await api('/api/heartbeat', {}, true); // 25598
      if (!data.ok || !Array.isArray(data.data) || data.data.length === 0) {
        $('#monitorEmpty').style.display = 'block';
        return;
      }
      $('#monitorEmpty').style.display = 'none';
      const raw = data.data;
      // 降采样到 ≤300 点
      const step = Math.max(1, Math.ceil(raw.length / 300));
      const pts = [];
      for (let i = 0; i < raw.length; i += step) pts.push(raw[i]);
      const times = pts.map(p => new Date((p.time || 0) * 1000).toLocaleTimeString());
      const tps = pts.map(p => Number(p.tps) || 0);
      const players = pts.map(p => Number(p.players) || 0);
      const tpsAvg = tps.length ? (tps.reduce((a, b) => a + b, 0) / tps.length).toFixed(1) : '0';
      $('#tpsAvg').textContent = '平均 ' + tpsAvg;
      $('#playersSum').textContent = '峰值 ' + Math.max(0, ...players);
      drawLineChart('tpsChart', times, tps, '#10b981');
      drawLineChart('playersChart', times, players, '#818cf8');
    } catch (e) {
      $('#monitorEmpty').style.display = 'block';
      $('#monitorEmpty').textContent = '加载心跳历史失败（需服务器在线记录）';
    }
  }

  function drawLineChart(canvasId, labels, values, color) {
    const cv = document.getElementById(canvasId);
    if (!cv) return;
    const css = getComputedStyle(document.documentElement);
    const textColor = css.getPropertyValue('--text-secondary').trim() || '#8b93ad';
    const gridColor = css.getPropertyValue('--border').trim() || '#1c2133';
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 600, h = cv.clientHeight || 190;
    cv.width = w * dpr; cv.height = h * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);
    if (!values.length) return;
    const padL = 10, padR = 10, padT = 12, padB = 22;
    const max = Math.max(1, ...values);
    const min = 0;
    const span = (max - min) || 1;
    const X = (i) => padL + (values.length === 1 ? (w - padL - padR) / 2 : (w - padL - padR) * i / (values.length - 1));
    const Y = (v) => padT + (h - padT - padB) * (1 - (v - min) / span);
    // 网格
    ctx.strokeStyle = gridColor; ctx.lineWidth = 1;
    ctx.font = '10px sans-serif'; ctx.fillStyle = textColor;
    for (let g = 0; g <= 4; g++) {
      const gy = padT + (h - padT - padB) * g / 4;
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(w - padR, gy); ctx.stroke();
      ctx.fillText((max - span * g / 4).toFixed(max > 50 ? 0 : 1), 2, gy + 3);
    }
    // 折线
    ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
    ctx.beginPath();
    values.forEach((v, i) => { const x = X(i), y = Y(v); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
    // 时间轴标签（首/中/尾）
    ctx.fillStyle = textColor;
    [0, Math.floor((labels.length - 1) / 2), labels.length - 1].forEach((i) => {
      ctx.fillText(labels[i] || '', X(i) - 20, h - 6);
    });
  }

  // 页面切换
  function switchPage(page) {
    state.currentPage = page;
    $$('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
    $$('.page').forEach(el => el.classList.toggle('active', el.id === page + 'Page'));
    const titles = { console: 'MC 控制台', monitor: '历史监控', workflow: '工作流', files: '文件管理', frame: '框架后台' };
    $('#pageTitle').textContent = titles[page] || '';
    if (page === 'workflow') loadWorkflows();
    if (page === 'monitor') loadMonitor();
    if (page === 'files') loadFiles(state.filesPath);
  }

  // 主题切换
  function toggleTheme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.className = state.theme === 'light' ? 'light' : '';
    localStorage.setItem('mc_theme', state.theme);
    $('#toggleTheme').textContent = state.theme === 'dark' ? '🌙' : '☀️';
  }

  // 事件绑定
  function bindEvents() {
    $('#loginBtn').addEventListener('click', login);
    $('#loginPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
    $('#logoutBtn').addEventListener('click', logout);
    $('#toggleSidebar').addEventListener('click', () => $('#sidebar').classList.toggle('collapsed'));
    $('#toggleTheme').addEventListener('click', toggleTheme);

    $$('.nav-item').forEach(el => {
      el.addEventListener('click', () => switchPage(el.dataset.page));
    });

    $('#sendCmdBtn').addEventListener('click', () => sendCommand($('#cmdInput').value));
    $('#cmdInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendCommand($('#cmdInput').value); });

    $$('.btn-cmd').forEach(el => {
      el.addEventListener('click', () => {
        const cmd = el.dataset.cmd;
        if (cmd.endsWith(' ')) {
          $('#cmdInput').value = cmd;
          $('#cmdInput').focus();
        } else {
          sendCommand(cmd);
        }
      });
    });

    $('#refreshWfBtn').addEventListener('click', loadWorkflows);
    $('#monitorRefresh').addEventListener('click', loadMonitor);
    $('#newWfBtn').addEventListener('click', () => { location.href = 'workflow.html'; });

    $('#filesRefreshBtn').addEventListener('click', () => loadFiles(state.filesPath));
    $('#filesBackBtn').addEventListener('click', () => {
      const parts = state.filesPath.split('/').filter(Boolean);
      parts.pop();
      loadFiles('/' + parts.join('/') || '/');
    });

    $('#filesList').addEventListener('click', (e) => {
      const item = e.target.closest('.file-item');
      if (!item) return;
      const path = item.dataset.path;
      const isDir = item.dataset.isDir === 'true';
      if (isDir) loadFiles(path);
      else viewFile(path);
    });
    $('#fileViewerClose').addEventListener('click', closeFileViewer);
    $('#fileViewer').addEventListener('click', (e) => { if (e.target === $('#fileViewer')) closeFileViewer(); });
  }

  // agent FS|LIST 输出：每行 "F|D\t大小\tMM-dd HH:mm\t文件名" → 结构化条目
  function parseFileList(out, dir) {
    if (Array.isArray(out)) return out;
    if (!out || typeof out.output !== 'string') return [];
    const base = String(dir || '/').replace(/\/+$/, '') || '';
    const rows = [];
    out.output.split('\n').forEach((line) => {
      line = line.replace(/\r$/, '');
      if (!line.trim()) return;
      const parts = line.split('\t');
      if (parts.length < 4) return;
      rows.push({
        name: parts[3],
        is_dir: parts[0] === 'D',
        size: parseInt(parts[1], 10) || 0,
        path: base + '/' + parts[3],
      });
    });
    return rows;
  }

  // 查看文件内容（FS|READ）
  async function viewFile(path) {
    $('#fileViewerPath').textContent = path;
    $('#fileContent').textContent = '加载中…';
    $('#fileViewer').style.display = 'flex';
    try {
      const rel = String(path).replace(/^\/+/, '') || '.';
      const data = await api('/api/mc/fs', {
        method: 'POST',
        body: JSON.stringify({ op: 'read', path: rel, maxBytes: 262144 }),
      });
      if (data.code === 0) {
        const out = String(((data.data && data.data.output) || '')).replace(/^----- .+ -----\r?\n?/, '');
        $('#fileContent').textContent = out || '（空文件）';
      } else {
        $('#fileContent').textContent = '读取失败: ' + (data.msg || '未知错误');
      }
    } catch (e) {
      $('#fileContent').textContent = '请求失败: ' + e.message;
    }
  }

  function closeFileViewer() {
    $('#fileViewer').style.display = 'none';
  }

  // 初始化
  function init() {
    document.documentElement.className = state.theme === 'light' ? 'light' : '';
    $('#toggleTheme').textContent = state.theme === 'dark' ? '🌙' : '☀️';
    bindEvents();
    checkAuth();
  }

  init();
})();
</script>
<!-- 文件查看浮层 -->
<style>
  .file-viewer-mask {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center;
    padding: 24px;
  }
  .file-viewer-box {
    background: var(--overlay-bg, #10131d);
    border: 1px solid var(--border, #1c2133);
    border-radius: 10px;
    width: 100%; max-width: 860px; height: 76vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .file-viewer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border, #1c2133);
    color: var(--text-regular, #c8cddd); font-size: 13px;
  }
  .file-viewer-path { font-family: Consolas, Menlo, monospace; color: var(--text-primary, #e8ebf4); word-break: break-all; }
  .file-viewer-pre {
    flex: 1; overflow: auto; margin: 0; padding: 12px 14px;
    background: var(--fill, #10131d); color: var(--text-primary, #e8ebf4);
    font-family: Consolas, Menlo, monospace; font-size: 12.5px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all;
  }
</style>
<div id="fileViewer" class="file-viewer-mask">
  <div class="file-viewer-box">
    <div class="file-viewer-head">
      <span>📄 <span class="file-viewer-path" id="fileViewerPath"></span></span>
      <button id="fileViewerClose" class="btn btn-sm">关闭</button>
    </div>
    <pre id="fileContent" class="file-viewer-pre"></pre>
  </div>
</div>
</body>
